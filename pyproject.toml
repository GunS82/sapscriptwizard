[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapscriptwizard"
version = "1.0.0"
description = "Two-layer SAP GUI scripting toolkit"
readme = "README.md"
authors = [{ name = "SapScriptWizard" }]
requires-python = ">=3.10"
dependencies = [
  "pywin32>=305; platform_system == 'Windows'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "mypy>=1.8",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sapscriptwizard*"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:sapscriptwizard.compat.legacy",
]

[tool.ruff]
line-length = 100
src = ["sapscriptwizard", "tests"]
extend-exclude = ["utils", "parallel", "types_", "sapscriptwizard.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "S", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802", "I001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_unused_ignores = true
strict = false
ignore_missing_imports = true
